name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Security issue?** Do not file it here. See SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Lockward version
      placeholder: "lockward version output"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent involved
      options: [Claude Code, Cursor, Codex, Gemini CLI, Windsurf, GitHub Copilot, None / core]
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
