name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -s -l .)" || (gofmt -s -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        shell: bash
        run: go test -race -coverprofile=coverage.out ./...
      - name: coverage gate (LW-NFR-07)
        if: runner.os == 'Linux'
        run: |
          go test -cover ./internal/lock ./internal/hash ./internal/policy | tee cover.txt
          awk '/coverage:/ { gsub("%", "", $5); if ($5 + 0 < 90) { print "coverage below 90% for " $2; bad = 1 } } END { exit bad }' cover.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          # Build from source with the go.mod toolchain: release binaries may be
          # built with an older Go and refuse to lint a newer module.
          install-mode: goinstall
      - name: action scripts parse
        run: bash -n action/install.sh && bash -n action/run.sh

  offline:
    name: test with networking disabled (LW-NFR-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Download modules and build tests (with network)
        run: go mod download && go test -count=1 -run '^$' ./...
      - name: Run tests without network
        run: sudo unshare -n -- env "PATH=$PATH" "HOME=$HOME" GOFLAGS=-mod=mod GOPROXY=off GOTOOLCHAIN=local go test -count=1 ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Fuzz parsers (20s each)
        run: |
          set -e
          for target in \
            "./internal/hash FuzzCanonicalizeJSON" \
            "./internal/lock FuzzDecode" \
            "./internal/policy FuzzParse" \
            "./internal/ignore FuzzParse" \
            "./internal/prose FuzzDiff" \
            "./internal/redact FuzzRedactNeverLeaksToken" \
            "./internal/adapter FuzzConfigParsers"; do
            set -- $target
            go test "$1" -run '^$' -fuzz "^$2\$" -fuzztime 20s
          done

  build:
    name: cross-compile and reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build every release target (CGO disabled)
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o /dev/null ./cmd/lockward
            done
          done
      - name: Two builds are byte-identical (LW-NFR-08)
        run: |
          # Write outside the checkout: an untracked file would mark the second
          # build's embedded VCS info as modified.
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=ci" -o "$RUNNER_TEMP/a" ./cmd/lockward
          go clean -cache
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=ci" -o "$RUNNER_TEMP/b" ./cmd/lockward
          cmp "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"

  dogfood:
    name: verify this repository's own agent assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go run ./cmd/lockward verify --frozen --scope project
