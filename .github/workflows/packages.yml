name: packages

# Publishes the npm package `lockward` and the PyPI package `lockward` for a
# release. Both are thin launchers with the release's SHA-256 values baked in
# (see packaging/). The values come from checksums.txt only after its
# Sigstore signature verifies; the packages are tested on Linux, macOS and
# Windows; then they are published with OIDC trusted publishing, so no
# registry token is stored anywhere. npm adds provenance, PyPI attestations.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package, e.g. v0.2.2
        required: true
      publish:
        description: Publish to npm and PyPI after the tests pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.render.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Render packages from the verified checksums
        id: render
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          packaging/render.sh "$TAG"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build
        run: |
          mkdir -p packaging/out/npm packaging/out/pypi
          (cd packaging/npm && npm pack --pack-destination ../out/npm)
          python -m pip install build==1.6.1
          python -m build packaging/pypi --outdir packaging/out/pypi
          ls -l packaging/out/npm packaging/out/pypi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: packaging/out/
          if-no-files-found: error

  test:
    needs: build
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: out
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: npm package runs the verified binary
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          npm install --prefix t out/npm/lockward-*.tgz
          out="$(node t/node_modules/lockward/bin/lockward.js version)"
          echo "$out"; test "$out" = "lockward ${VERSION}"
      - name: PyPI package runs the verified binary
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv v
          if [ -x v/bin/python ]; then py=v/bin/python; else py=v/Scripts/python.exe; fi
          "$py" -m pip install out/pypi/*.whl
          out="$("$py" -m lockward version)"
          echo "$out"; test "$out" = "lockward ${VERSION}"

  publish-npm:
    needs: [build, test]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/lockward
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (OIDC); provenance is automatic
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: out
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.2
      - name: Publish (skipped when this version is already on npm)
        shell: bash
        run: |
          tgz=$(ls out/npm/lockward-*.tgz)
          version=${tgz##*/lockward-}; version=${version%.tgz}
          if npm view "lockward@${version}" version >/dev/null 2>&1; then
            echo "::notice::lockward@${version} is already on npm; nothing to publish"
            exit 0
          fi
          npm publish "$tgz" --access public

  publish-pypi:
    needs: [build, test]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lockward
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC); attestations are automatic
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: out
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: out/pypi/
